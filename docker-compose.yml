# Infraestrutura: SQL Server + API (Semana 3, Parte 2).
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: mobilidade-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-Mobilidade#2026}
      MSSQL_PID: Express
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    
    
  api:
    build:
     context: .
     dockerfile: backend/src/Mobilidade.Api/Dockerfile
    ports:
     - "8080:8080"
    environment:
     ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=master;User Id=sa;TrustServerCertificate=True;Password=${MSSQL_SA_PASSWORD}"
    depends_on:
     sqlserver:
      condition: service_healthy

# Volume nomeado: sobrevive a `docker compose down` (só some com `down -v`).
volumes:
  sqlserver_data: 
